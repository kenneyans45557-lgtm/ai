name: TikTok Viral Video Generator

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: System-Video-Tools installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Python Video-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests pyTelegramBotAPI gTTS moviepy

      - name: GENERIERE VIRALES TIKTOK VIDEO
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.KI_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > make_video.py
          import os, requests, random, telebot
          from gtts import gTTS
          # HIER IST DER FIX: Neuer Import-Weg für die aktuelle MoviePy-Version!
          from moviepy import AudioFileClip, VideoFileClip, ColorClip

          BOT_TOKEN = str(os.getenv("TELEGRAM_BOT_TOKEN")).strip()
          CHAT_ID = str(os.getenv("TELEGRAM_CHAT_ID")).strip()
          bot = telebot.TeleBot(BOT_TOKEN)

          print("=== VIDEO FABRIK STARTET ===")

          STORIES = [
              "Mein Kumpel hat versucht mich beim Trading abzuziehen. Er dachte, ich merke nicht, dass er meine Signale klaut. Also habe ich ihm ein falsches Signal mit riesigem Risiko gegeben. Am nächsten Tag war sein Konto komplett auf null und er hat mich weinend angerufen. Karma schlägt eben immer zurück.",
              "Ich habe heimlich den alten Laptop meines Bruders auf dem Dachboden gefunden. Als ich ihn hochgefahren habe, war dort eine alte Krypto-Wallet aus dem Jahr 2013 drauf. Ich dachte erst es ist ein Witz, aber da lagen einfach drei ganze Bitcoin drauf. Ich habe es ihm noch nicht erzählt. Wie soll ich reagieren?",
              "Mein Chef hat mich gefeuert, weil ich angeblich zu viel am Handy war. Was er nicht wusste: Ich habe in der Zeit mein eigenes automatisiertes Business über Bots aufgebaut. Heute verdient mein System im Monat mehr als er im ganzen Jahr. Gestern hat er mich gefragt, ob ich wieder zurückkommen will."
          ]
          
          selected_story = random.choice(STORIES)
          print(f"Ausgewählte Story: {selected_story}")

          print("Generiere Stimme...")
          tts = gTTS(text=selected_story, lang='de', slow=False)
          tts.save("story.mp3")

          audio_clip = AudioFileClip("story.mp3")
          duration = audio_clip.duration
          print(f"Video-Dauer wird: {duration} Sekunden")

          print("Schneide Video zusammen...")
          video_clip = ColorClip(size=(1080, 1920), color=(20, 20, 35), duration=duration)
          
          final_clip = video_clip.set_audio(audio_clip)
          final_clip.write_videofile("tiktok_output.mp4", fps=24, codec="libx264", audio_codec="aac")

          print("Sende Video an Telegram...")
          bot.send_message(CHAT_ID, f"🚀 DEIN NEUES TIKTOK-VIDEO IST FERTIG, BRO!\n\n📄 **Text des Videos:**\n\"{selected_story}\"\n\nLade es jetzt einfach auf dein Handy und pack es direkt auf TikTok! Let's go!")
          
          with open("tiktok_output.mp4", "rb") as video_file:
              bot.send_video(CHAT_ID, video_file, timeout=120)

          print("=== VIDEO ERFOLGREICH AN TELEGRAM GESENDET ===")
          EOF
          python make_video.py
